<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iykyk · Get the joke</title>
<meta name="description" content="IYKYK finds the cultural context you're missing in English comments, explains just enough, and remembers what you already know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="ast"><g fill="#111"><rect x="-15" y="-50" width="30" height="100" rx="15"/><rect x="-15" y="-50" width="30" height="100" rx="15" transform="rotate(60)"/><rect x="-15" y="-50" width="30" height="100" rx="15" transform="rotate(120)"/></g><g fill="#D4FF3A"><rect x="-10" y="-45" width="20" height="90" rx="10"/><rect x="-10" y="-45" width="20" height="90" rx="10" transform="rotate(60)"/><rect x="-10" y="-45" width="20" height="90" rx="10" transform="rotate(120)"/></g></g>
</defs></svg>

<div class="browser">
  <div class="bbar">
    <div class="addr"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#5E5E5E" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="addr-text"></span></div>
    <span class="bhint" id="bhint">Click the IYKYK icon →</span>
    <button class="ext" id="ext-btn" type="button" aria-label="IYKYK extension: open or close" title="IYKYK"><img src="/extension/icons/icon32.png" alt="" width="22" height="22"></button>
  </div>
  <div class="layout" id="layout">
    <!-- Left: the page you are on (a sample post) -->
    <section class="feed" aria-label="Sample page">
      <article class="pcard" id="pcard">
        <div class="pmedia" id="pmedia" hidden></div>
        <div class="pthread">
          <header class="pc-head"><span class="tag" id="post-source"></span><span class="pc-sub" id="post-title"></span></header>
          <p class="caption" id="post-caption"></p>
          <p class="pc-scene" id="reel-scene"></p>
          <ol class="comments" id="comments"></ol>
        </div>
      </article>
      <div class="post-nav">
        <button class="ghost" id="prev-post" type="button">← Previous page</button>
        <span class="demo-note">Sample pages for the demo</span>
        <button class="ghost strong" id="next-post" type="button">Next page →</button>
      </div>
    </section>

    <!-- Right: the extension's own panel, opened by its icon -->
    <aside class="panel" id="panel" aria-label="IYKYK panel" hidden>
      <iframe id="panel-frame" title="IYKYK panel"></iframe>
    </aside>
  </div>
</div>

<button class="ask-btn" id="ask-btn" type="button" hidden>Ask IYKYK</button>

<script src="/app/samples.js"></script>
<script src="/app/demo.js"></script>
</body>
</html>
