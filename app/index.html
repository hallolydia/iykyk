<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iykyk · Get the joke</title>
<meta name="description" content="IYKYK finds the cultural context you're missing in English comments, explains just enough, and remembers what you already know.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="ast"><g fill="#111"><rect x="-15" y="-50" width="30" height="100" rx="15"/><rect x="-15" y="-50" width="30" height="100" rx="15" transform="rotate(60)"/><rect x="-15" y="-50" width="30" height="100" rx="15" transform="rotate(120)"/></g><g fill="#D4FF3A"><rect x="-10" y="-45" width="20" height="90" rx="10"/><rect x="-10" y="-45" width="20" height="90" rx="10" transform="rotate(60)"/><rect x="-10" y="-45" width="20" height="90" rx="10" transform="rotate(120)"/></g></g>
</defs></svg>

<header class="top">
  <a class="logo" href="#" aria-label="iykyk home">iykyk<svg viewBox="-55 -55 110 110" width="16" height="16" aria-hidden="true"><use href="#ast"/></svg></a>
  <p class="demo-note">Live demo. The panel on the right is the real extension, reading a sample post.</p>
</header>

<div class="layout">
  <!-- Left: a neutral sample post, standing in for Instagram -->
  <section class="feed" aria-label="Sample post">
    <div class="post">
      <div class="reel" aria-hidden="true"><div class="reel-inner"><span class="reel-label">Reel</span><p class="reel-scene" id="reel-scene"></p></div></div>
      <div class="thread">
        <div class="post-meta"><span class="tag" id="post-source"></span><span id="post-title"></span></div>
        <p class="caption" id="post-caption"></p>
        <ol class="comments" id="comments"></ol>
        <div class="post-nav">
          <button class="ghost" id="prev-post" type="button">← Previous post</button>
          <button class="ghost strong" id="next-post" type="button">Next post →</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Right: the real extension panel, in demo mode -->
  <aside class="panel" aria-label="IYKYK panel">
    <iframe id="panel-frame" title="IYKYK panel" src="/extension/sidepanel.html?demo"></iframe>
  </aside>
</div>

<button class="ask-btn" id="ask-btn" type="button" hidden>Ask IYKYK</button>

<script src="/app/samples.js"></script>
<script src="/app/demo.js"></script>
</body>
</html>
